<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reporte de Solicitudes</title>
  <link rel="stylesheet" href="./styles/reporteSolicitudes.css">
</head>

<body>

  <!-- ==========================
       HEADER
  ========================== -->
  <div class="header">
    <div class="header-top">
      <div>
        <div class="empresa-nombre" id="empresaNombre"></div>
        <div class="reporte-titulo">Reporte de Solicitudes</div>
      </div>
      <div class="header-meta" id="fechaGeneracion"></div>
    </div>
    <div class="header-meta" id="periodo"></div>
  </div>

  <!-- ==========================
       FILTROS
  ========================== -->
  <div class="filters" id="filters"></div>

  <!-- ==========================
       KPIS
  ========================== -->
  <div class="kpis">
    <div class="kpi">
      <div class="kpi-label">Total solicitado</div>
      <div class="kpi-value" id="kpiTotalSolicitado"></div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Total pagado</div>
      <div class="kpi-value" id="kpiTotalPagado"></div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Saldo pendiente</div>
      <div class="kpi-value" id="kpiSaldoPendiente"></div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Total registros</div>
      <div class="kpi-value" id="kpiTotalRegistros"></div>
    </div>
  </div>

  <!-- ==========================
       TABLA
  ========================== -->
  <table>
    <thead>
      <tr>
        <th>Correlativo</th>
        <th>Proveedor</th>
        <th>Fecha solicitud</th>
        <th>Fecha factura</th>
        <th>N° Factura</th>
        <th>Tipo pago</th>
        <th>Banco</th>
        <th>Cuenta</th>
        <th>Total</th>
        <th>Pagado</th>
        <th>Saldo</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <!-- ==========================
       FOOTER
  ========================== -->
  <div class="footer">
    Documento generado automáticamente por el sistema
  </div>

  <!-- ==========================
       SCRIPT DE INYECCIÓN
  ========================== -->
  <script>
    const data = window.__DATA__;

    // HEADER
    document.getElementById("empresaNombre").innerText = data.empresa.nombre;
    document.getElementById("periodo").innerText =
      "Periodo: " + (data.metadata.periodo || "General");
    document.getElementById("fechaGeneracion").innerText =
      "Generado: " + new Date(data.metadata.generadoEn).toLocaleString("es-HN");

    // FILTROS
    const filtersDiv = document.getElementById("filters");
    const filtros = data.metadata.filtros || {};
    filtersDiv.innerHTML =
      "<strong>Filtros aplicados:</strong> " +
      (Object.keys(filtros).length
        ? Object.entries(filtros)
            .map(([k, v]) => `<span>${k}: ${v}</span>`)
            .join("")
        : "<span>Ninguno</span>");
    
    // KPIS
    document.getElementById("kpiTotalSolicitado").innerText = data.resumen.totalSolicitado;
    document.getElementById("kpiTotalPagado").innerText = data.resumen.totalPagado;
    document.getElementById("kpiSaldoPendiente").innerText = data.resumen.saldoPendiente;
    document.getElementById("kpiTotalRegistros").innerText = data.resumen.totalRegistros;

    // TABLA
    const tbody = document.getElementById("tableBody");

    data.detalle.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.correlativo}</td>
        <td>${r.proveedor}</td>
        <td>${r.fecha_solicitud}</td>
        <td>${r.fecha_factura}</td>
        <td>${r.numero_factura}</td>
        <td>${r.tipo_pago}</td>
        <td>${r.banco}</td>
        <td>${r.cuenta}</td>
        <td class="numeric">${r.total}</td>
        <td class="numeric">${r.pagado}</td>
        <td class="numeric">${r.saldo}</td>
        <td>${r.estado}</td>
      `;
      tbody.appendChild(tr);
    });
  </script>

</body>
</html>
